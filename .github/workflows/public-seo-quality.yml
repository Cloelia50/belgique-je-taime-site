name: Contrôles SEO — dépôt public (sans quota privé)
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'guides/**'
      - 'evenements/**'
      - 'sorties-permanentes/**'
      - 'index.html'
      - 'sitemap.xml'
      - '.github/workflows/public-seo-quality.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du générateur hors réseau
        run: node scripts/test_seo_offline.mjs
      - name: Vérifier les liens internes
        run: node scripts/test_seo_links.mjs
      - name: Vérifier les aides immédiates EcoTank (test local, aucun robot)
        run: node scripts/test_ecotank_fast_help.mjs
      - name: Vérifier les réservations Activikids et préserver les fiches
        run: node scripts/test_activikids_booking_guard.mjs
      - name: Vérifier les correctifs Cogito et les identifiants
        run: node scripts/test_cogito_curations.mjs
      - name: Vérifier l'accueil, les guides et les permanents
        run: node scripts/verify_public_release.mjs
