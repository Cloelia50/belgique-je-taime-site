name: Signaler une erreur
description: Date, lien, aide, montant ou problème technique à vérifier
title: "[Signalement] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Merci. Ce formulaire est public. **Ne publiez aucune donnée personnelle ou sensible** : numéro de registre national, revenus, santé, adresse privée, code itsme/eID, mot de passe ou document administratif.
  - type: dropdown
    id: service
    attributes:
      label: Partie du site concernée
      options:
        - Activikids
        - Écotank
        - Cogito
        - Accueil / site global
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type de problème
      options:
        - Événement annulé ou mauvaise date
        - Lien cassé ou mauvaise redirection
        - Aide / règle / montant potentiellement dépassé
        - Information incorrecte
        - Problème d'affichage ou de fonctionnement
        - Autre
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page Belgique, je t’aime concernée
      placeholder: https://cloelia50.github.io/belgique-je-taime-site/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Que faut-il vérifier ?
      description: Décrivez uniquement le problème, sans information personnelle.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source officielle utile, si vous l’avez
      placeholder: https://...
  - type: checkboxes
    id: privacy
    attributes:
      label: Vie privée
      options:
        - label: Je confirme ne pas avoir inclus de donnée personnelle ou sensible.
          required: true
