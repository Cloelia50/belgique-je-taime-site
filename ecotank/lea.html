<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoTank — mes études pas à pas</title><style>body{font:18px/1.5 system-ui,sans-serif;background:#f7f8fa;color:#192632;margin:0}main{max-width:700px;margin:auto;padding:22px}article{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 15px #0001}button,select,a.action{display:block;width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid #526579;border-radius:10px;margin:9px 0;color:#172838;background:#fff;text-align:left}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #2a67ba}button[aria-pressed=true]{background:#e2efff}a{color:#095caa}textarea{width:100%;box-sizing:border-box;font:inherit}small{color:#445}h1{font-size:1.7rem}h2{font-size:1.3rem}</style></head><body><main><p><a href="./">← EcoTank</a></p><article id="app"><h1>Mes études, une chose à la fois</h1><p>Chargement…</p></article></main><script src="./student-help-module.js"></script><script>
const d=window.EcoTankStudentHelp,app=document.getElementById('app');
const get=()=>{try{return JSON.parse(localStorage.getItem('ecotank-lea-guided-v1')||'{}')}catch(e){return {}}},save=(k,v)=>{const x=get();x[k]=v;localStorage.setItem('ecotank-lea-guided-v1',JSON.stringify(x))};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=[['grant','Demander ma bourse','Bourse FWB : avant le 31 octobre 2026'],['employment','Vérifier mes heures de travail','650 heures et allocations familiales'],['school','Me faire aider par mon école','Un interlocuteur humain pour mon kot et mes études'],['transport','Mon abonnement STIB','Vérifier le tarif adapté à mon âge'],['kot','Mon kot et la garantie locative','Vérifier mon bail et les frais']];
let current='';
function home(){const x=get();app.innerHTML='<h1>Mes études, une chose à la fois</h1><p>Tu peux étudier et avoir un job étudiant. Choisis la chose la plus urgente, le reste peut attendre.</p><label for="school">Ton établissement</label><select id="school">'+Object.entries(d.institutions).map(([k,v])=>'<option value="'+esc(k)+'" '+((x.school||'other')===k?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select><p><strong>Priorité :</strong> déposer la demande FWB avant le 31 octobre 2026, même si des pièces manquent.</p>'+steps.map(s=>'<button data-step="'+s[0]+'">'+(x['done_'+s[0]]?'✓ ':'')+esc(s[1])+' — '+esc(s[2])+'</button>').join('')+'<p><button id="clear">Effacer mon suivi sur cet appareil</button></p>';document.getElementById('school').onchange=e=>save('school',e.target.value);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>openStep(b.dataset.step));document.getElementById('clear').onclick=()=>{localStorage.removeItem('ecotank-lea-guided-v1');home()}}
function openStep(k){current=k;const x=get(),school=d.institutions[x.school]||d.institutions.other;let title='',list=[],url='',person='',email='';
if(k==='grant'){title='Je demande ma bourse';list=d.grant.steps;url=d.grant.url;person='Fédération Wallonie-Bruxelles';}
if(k==='employment'){title='Je vérifie mon job étudiant';list=d.employment.steps;url=d.employment.url;person='Student@work et caisse d’allocations familiales';}
if(k==='school'){title='Je demande de l’aide à mon établissement';list=school.steps;url=school.url;person=school.name;email=school.email||'';}
if(k==='transport'){title='Je vérifie mon abonnement STIB';list=['Vérifie ton âge et ta domiciliation','Ouvre la page des abonnements STIB pour jeunes','Vérifie le justificatif demandé avant de payer'];url='https://www.stib-mivb.be/';person='STIB';}
if(k==='kot'){title='Je vérifie mon kot';list=['Retrouve ton bail et ton pacte de colocation, si tu en as un','Vérifie la garantie, les charges et les règles de sortie','En cas de difficulté, demande une aide avant de signer ou payer'];url='https://be.brussels/fr/logement/location/bail-dhabitation/garantie-locative';person='Bruxelles Logement';}
const message=k==='school'?d.email(school):'Bonjour, je suis étudiante à Bruxelles et souhaite de l’aide pour : '+title.toLowerCase()+'. Pouvez-vous me préciser les conditions, pièces nécessaires et la prochaine démarche ? Merci.';
app.innerHTML='<h1>'+esc(title)+'</h1><p><strong>Contact :</strong> '+esc(person)+(school.phone&&k==='school'?' · '+esc(school.phone):'')+'</p><ol>'+list.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol><p><a class="action" target="_blank" rel="noopener" href="'+esc(url)+'">Ouvrir le site officiel ↗</a></p><h2>Quoi dire ou écrire</h2><textarea id="script" rows="6">'+esc(message)+'</textarea><button id="copy">Copier ce message</button><a class="action" href="mailto:'+esc(email)+'?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(message)+'">Préparer un courriel'+(email?' à '+esc(email):' (adresse à vérifier)')+'</a><h2>Mon avancée</h2>'+['À faire','Demande envoyée','En attente','Je bloque','C’est réglé'].map(v=>'<button data-status="'+esc(v)+'" aria-pressed="'+((x['status_'+k]||'À faire')===v)+'">'+esc(v)+'</button>').join('')+'<p id="next" role="status"></p><button id="back">Retour aux démarches</button>';
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('script').value);document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{save('status_'+k,b.dataset.status);if(b.dataset.status==='C’est réglé')save('done_'+k,true);openStep(k)});document.getElementById('next').textContent=(x['status_'+k]==='Je bloque'?'Contacte le service pour demander une aide humaine, une autre manière de faire ou les motifs d’un refus.':x['status_'+k]==='En attente'?'Conserve ton accusé de réception et vérifie les prochaines échéances.':'Une seule étape à la fois, sans transmettre tes documents ici.');document.getElementById('back').onclick=home;}
home();
</script></body></html>
